name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 恢复签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $HOME/biliXia-release.jks
          ls -lh $HOME/biliXia-release.jks

      - name: 给 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 Release APK
        env:
          KEYSTORE_FILE: /home/runner/biliXia-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 重命名 APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             out/BiliXia-${GITHUB_REF_NAME}.apk

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/BiliXia-*.apk
          generate_release_notes: true