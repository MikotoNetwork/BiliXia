name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 编译 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 重命名 APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             out/BiliXia-${GITHUB_REF_NAME}.apk

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/BiliXia-*.apk
          generate_release_notes: true